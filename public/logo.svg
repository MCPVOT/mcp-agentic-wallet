<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- Cyan glow filter -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black background -->
  <rect width="64" height="64" fill="#000"/>

  <!-- Pixel grid - 16x16 base scaled to 64x64 (each pixel = 4x4) -->
  <!-- Colors: 0=transparent, 1=dark outline, 2=golden body, 3=bright gold,
       4=dark pit, 5=cyan glow, 6=stem green, 7=deep gold shadow -->

  <!-- Row 0: antenna tip -->
  <rect x="24" y="0" width="4" height="4" fill="#5DEDF9"/>
  <rect x="28" y="0" width="4" height="4" fill="#5DEDF9"/>
  <rect x="32" y="0" width="4" height="4" fill="#5DEDF9"/>
